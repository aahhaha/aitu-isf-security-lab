# Design examples for the isolated 10.10.10.0/24 lab, not a production daemon configuration.
DNS: bind only to the lab interface; allow recursion only from 10.10.10.0/24; log denied recursion.
DHCP: scope 10.10.10.100-10.10.10.150; gateway 10.10.10.1; exclude router/server addresses.
SNMP: version 3 authPriv; read-only monitoring role; manager allowlist; credentials supplied externally.
Cloud ingress: HTTPS only; application-to-database on the database port; no direct student database access.
